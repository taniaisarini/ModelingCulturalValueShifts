# Recreate the environment used for this project:  conda env create -f environment.yml
# (versions are those of the working `wvs` environment; python 3.13)
name: wvs
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy=2.2
  - pandas=2.2
  - scipy=1.17
  - scikit-learn=1.8
  - matplotlib=3.10
  - pyarrow=19
  - pillow=11
  - tqdm
  - httpx
  - ipykernel
  - pip
  - pip:
      - openai==1.77.0
      - google-cloud-bigquery==3.46.2
