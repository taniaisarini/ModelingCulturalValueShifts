# Copy to code/config.local.toml (not committed) and edit for this machine. Every key is optional.
gdelt_dir = "/path/to/gdelt_data"            # large GDELT files, outside the repo if the disk is small
plots_dir = "/path/to/gdelt_plots"           # defaults to <repo>/gdelt_plots
raw_events_dir = "/path/to/raw_events"       # row-level GDELT pulls; defaults to <gdelt_dir>/raw_events
